# Builds ape.density~ and ape.pulsaret~ on GitHub's own machines, with the current Max SDK
# (max-sdk-base, downloaded by CMake at a fixed version). No local Windows machine is needed.
#
#   Windows  ->  externals/*.mxe64   (x64)
#   macOS    ->  externals/*.mxo     (universal: Apple silicon + Intel)
#   package  ->  the Max package, as costruisci.command makes it on a Mac, with the objects
#                for both systems: ApeExternals-<version>-macOS-Windows.zip
#
# It runs on every push, on pull requests, and by hand: Actions tab -> Build -> "Run workflow".
# The results are at the bottom of each run page, under "Artifacts".

name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (Visual Studio, x64)
        run: cmake -B build -A x64

      - name: Build (Release)
        run: cmake --build build --config Release

      - name: List the results
        shell: bash
        run: ls -la externals

      - uses: actions/upload-artifact@v4
        with:
          name: ApeExternals-windows-x64
          path: externals/*.mxe64
          if-no-files-found: error

  macos:
    name: macOS (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (Xcode)
        run: cmake -G Xcode -B build

      - name: Build (Release)
        run: cmake --build build --config Release

      - name: Check the architectures
        run: |
          for n in "ape.density~" "ape.pulsaret~"; do
            lipo -archs "externals/$n.mxo/Contents/MacOS/$n"
          done

      # a .mxo is a folder: zip it with ditto so its code signature is kept
      - name: Zip
        run: |
          mkdir -p dist
          ditto -c -k --keepParent "externals/ape.density~.mxo"  "dist/ape.density~.mxo.zip"
          ditto -c -k --keepParent "externals/ape.pulsaret~.mxo" "dist/ape.pulsaret~.mxo.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ApeExternals-macos-universal
          path: dist/*.zip
          if-no-files-found: error

  # The Max package: the same folder that costruisci.command makes on a Mac
  # (externals, help, package-info.json, README.md), here with the objects for both systems.
  package:
    name: Max package (macOS + Windows)
    needs: [ windows, macos ]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts              # one folder for each artifact

      - name: Assemble the package
        run: |
          version=$(sed -n 's/.*"version" *: *"\([^"]*\)".*/\1/p' package-info.json | head -1)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          pkg="package/ApeExternals"
          mkdir -p "$pkg/externals" "$pkg/help"
          # macOS: the .mxo bundles were zipped with ditto, open them the same way
          for z in artifacts/ApeExternals-macos-universal/*.zip; do ditto -x -k "$z" "$pkg/externals"; done
          # Windows: the .mxe64 files
          cp artifacts/ApeExternals-windows-x64/*.mxe64 "$pkg/externals/"
          cp help/*.maxhelp "$pkg/help/"
          cp package-info.json "$pkg/"
          cp help/README.md "$pkg/README.md"
          ls -R package
          mkdir -p dist
          ditto -c -k --keepParent "$pkg" "dist/ApeExternals-$version-macOS-Windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ApeExternals-${{ env.VERSION }}-package
          path: dist/*.zip
          if-no-files-found: error

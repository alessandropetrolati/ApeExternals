# Builds ape.density~ and ape.pulsaret~ on GitHub's own machines, with the current Max SDK
# (max-sdk-base, downloaded by CMake at a fixed version), and makes the Max package for each
# system. No local Windows machine is needed.
#
# A Max package is a folder to copy into Documents/Max 9/Packages (or Max 8):
#
#   ApeExternals/
#     externals/           the objects: .mxo (macOS) or .mxe64 (Windows)
#     help/                the help patchers
#     package-info.json
#     README.md
#
# It is the same folder that costruisci.command makes on a Mac.
#
# Results (at the bottom of each run page, under "Artifacts"):
#   ApeExternals-<version>-macOS     universal objects: Apple silicon + Intel
#   ApeExternals-<version>-Windows   64-bit objects
#
# It runs on every push, on pull requests, and by hand: Actions tab -> Build -> "Run workflow".

name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows package (x64)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash                  # the same commands as on macOS
    steps:
      - uses: actions/checkout@v4

      - name: Configure (Visual Studio, x64)
        run: cmake -B build -A x64

      - name: Build (Release)
        run: cmake --build build --config Release

      - name: Make the Max package
        run: |
          version=$(sed -n 's/.*"version" *: *"\([^"]*\)".*/\1/p' package-info.json | head -1)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          pkg="package/ApeExternals"
          mkdir -p "$pkg/externals" "$pkg/help"
          cp externals/*.mxe64 "$pkg/externals/"
          cp help/*.maxhelp "$pkg/help/"
          cp package-info.json "$pkg/"
          cp help/README.md "$pkg/README.md"
          ls -R package

      # the artifact is the zip: inside there is the ApeExternals folder
      - uses: actions/upload-artifact@v4
        with:
          name: ApeExternals-${{ env.VERSION }}-Windows
          path: package
          if-no-files-found: error

  macos:
    name: macOS package (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (Xcode)
        run: cmake -G Xcode -B build

      - name: Build (Release)
        run: cmake --build build --config Release

      - name: Check the architectures
        run: |
          for n in "ape.density~" "ape.pulsaret~"; do
            lipo -archs "externals/$n.mxo/Contents/MacOS/$n"
          done

      - name: Make the Max package
        run: |
          version=$(sed -n 's/.*"version" *: *"\([^"]*\)".*/\1/p' package-info.json | head -1)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          pkg="package/ApeExternals"
          mkdir -p "$pkg/externals" "$pkg/help"
          # a .mxo is a folder: ditto copies it without breaking its code signature
          ditto "externals/ape.density~.mxo"  "$pkg/externals/ape.density~.mxo"
          ditto "externals/ape.pulsaret~.mxo" "$pkg/externals/ape.pulsaret~.mxo"
          cp help/*.maxhelp "$pkg/help/"
          cp package-info.json "$pkg/"
          cp help/README.md "$pkg/README.md"
          ls -R package
          mkdir -p dist
          ditto -c -k --keepParent "$pkg" "dist/ApeExternals-$version-macOS.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ApeExternals-${{ env.VERSION }}-macOS
          path: dist/*.zip
          if-no-files-found: error
